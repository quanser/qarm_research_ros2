<g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 966.2)">
<title>planner</title>
<polygon fill="white" stroke="none" points="-21.6,167.1 -21.6,-966.2 1280.32,-966.2 1280.32,167.1 -21.6,167.1"/>
<text xml:space="preserve" text-anchor="middle" x="629.36" y="40.15" font-family="Arial" font-size="17.00">pick, place and home are each one ReachPose goal to the RL policy;</text>
<text xml:space="preserve" text-anchor="middle" x="629.36" y="59.65" font-family="Arial" font-size="17.00">the other states are run by the planner itself.</text>
<text xml:space="preserve" text-anchor="middle" x="629.36" y="99.15" font-family="Arial" font-size="17.00">A failed pick or grasp counts as a failure; at max_consecutive_failures</text>
<text xml:space="preserve" text-anchor="middle" x="629.36" y="118.65" font-family="Arial" font-size="17.00">(0 = never) the planner stops in done. A completed drop resets the count.</text>
<text xml:space="preserve" text-anchor="middle" x="629.36" y="138.15" font-family="Arial" font-size="17.00">The home leg is retried until max_home_retries (0 = forever), then the planner stops in done.</text>
