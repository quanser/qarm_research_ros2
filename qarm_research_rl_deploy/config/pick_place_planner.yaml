/**:
  ros__parameters:
    target_topic: "vision/pick_target"
    joint_state_topic: "qarm_research/joint_states"
    # Startup joint move only.
    trajectory_topic: "qarm_research/joint_trajectory_command"
    gripper_position_topic: "qarm_research/gripper_position_command"
    gripper_current_topic: "qarm_research/gripper_current_command"
    # Measured gripper current, used to confirm the grasp.
    gripper_current_feedback_topic: "qarm_research/gripper_current"
    joint_names: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]

    # Home and place poses come from poses.yaml.

    # Arrival distance per leg, sent with each goal, m.
    position_tolerance_m: 0.01
    place_position_tolerance_m: 0.02
    home_position_tolerance_m: 0.05

    # Log the leg in flight's distance to target; set by the launch debug argument.
    debug_topics: false
    # Period of that log line, s.
    debug_log_period_sec: 1.0

    # Time limit per leg, sent with each goal, s.
    pick_timeout_sec: 20.0
    place_timeout_sec: 20.0
    home_timeout_sec: 20.0

    # Startup move: per-joint arrival error, rad.
    waypoint_joint_tolerance_rad: 0.03
    # Startup move: consecutive ticks within tolerance.
    waypoint_hold_cycles: 5
    # Startup move: time_from_start on the trajectory point, s. The driver ignores it.
    trajectory_time_from_start_sec: 1.02

    # State machine tick rate, Hz.
    check_rate_hz: 20.0
    # Timeout for the startup move, for a gripper current reading after closing, and for the
    # action server to appear for a pick or place goal, s.
    state_timeout_sec: 20.0

    # Gripper position commands for closed and open.
    gripper_close_position: 0.7
    gripper_open_position: 0.0
    # Gripper current command sent with each position.
    gripper_current: 0.5
    # Dwell after a gripper command, s.
    gripper_wait_sec: 1.0
    # Measured current above this after closing means an object is held.
    grasp_current_threshold: 0.1

    # Consecutive failed picks or grasps before halting; 0 never halts.
    max_consecutive_failures: 0
    # Wait past a goal's timeout before treating the server as gone, s.
    result_grace_sec: 5.0
    # Home leg retries before halting, so it halts on failure max_home_retries + 1; 0 retries forever.
    max_home_retries: 0
