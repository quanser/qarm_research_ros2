# Trimmed from a real IsaacLab run: only the keys the deployment reads.
decimation: 2
episode_length_s: 16.0
sim:
  dt: 0.016666666666666666
actions:
  arm_action:
    joint_names:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    scale: 0.5
    offset: 0.0
    use_default_offset: true
scene:
  robot:
    init_state:
      joint_pos:
        joint1: 0.26
        joint2: 0.869
        joint3: -2.0
        joint4: -0.0008
        joint5: -0.0008
        joint6: 0.26
        rh_r1_joint: 0.0
observations:
  policy:
    concatenate_terms: true
    enable_corruption: true
    history_length: null
    flatten_history_dim: true
    joint_pos:
      func: isaaclab.envs.mdp.observations:joint_pos_rel
      clip: null
      scale: null
      history_length: 0
    joint_vel:
      func: isaaclab.envs.mdp.observations:joint_vel_rel
      clip: null
      scale: null
      history_length: 0
    pose_command:
      func: isaaclab.envs.mdp.observations:generated_commands
      clip: null
      scale: null
      history_length: 0
    actions:
      func: isaaclab.envs.mdp.observations:last_action
      clip: null
      scale: null
      history_length: 0
commands:
  ee_pose:
    class_type: quanser_rl_lab.tasks.manager_based.qarm_research_reach.mdp.commands:TwoZoneUniformPoseCommand
    ranges:
      pos_x: !!python/tuple
      - 0.12
      - 0.55
      pos_y: !!python/tuple
      - -0.2
      - 0.2
      pos_z: !!python/tuple
      - 0.25
      - 0.45
      roll: !!python/tuple
      - -3.391592653589793
      - -2.891592653589793
      pitch: !!python/tuple
      - -0.25
      - 0.25
      yaw: !!python/tuple
      - -2.0943951023931953
      - -1.0471975511965979
    ranges_b:
      pos_x: !!python/tuple
      - 0.05
      - 0.15
      pos_y: !!python/tuple
      - 0.15
      - 0.25
      pos_z: !!python/tuple
      - 0.4
      - 0.6
      roll: !!python/tuple
      - -2.8679938779914944
      - -2.3679938779914944
      pitch: !!python/tuple
      - -0.25
      - 0.25
      yaw: !!python/tuple
      - -0.25
      - 0.25
    zone_b_prob: 0.3
