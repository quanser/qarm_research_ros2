[develop]
script_dir=$base/lib/qarm_research_rl_deploy
[install]
install_scripts=$base/lib/qarm_research_rl_deploy

[flake8]
max-line-length = 120
extend-ignore = W503
import-order-style = pep8
application-import-names = qarm_research_rl_deploy
inline-quotes = double
multiline-quotes = double
docstring-quotes = double
per-file-ignores =
    test/*:D100,D103
